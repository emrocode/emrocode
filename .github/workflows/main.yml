name: Skill Icons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  skill-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate Skill Icons
        id: generate-skill-icons
        uses: emrocode/skill-icons@v1
        with:
          icon_size: 24

